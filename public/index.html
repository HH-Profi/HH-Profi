<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Handball Trainer</title>
<style>
:root{--bg:#0b0f1a;--panel:#111827;--card:#182136;--line:rgba(255,255,255,.1);--text:#f0f4ff;--muted:rgba(240,244,255,.6);--accent:#e8ff47;--danger:#ff7070;--ok:#4ecd64;--blue:#45b7d1}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,-apple-system,Segoe UI,sans-serif}#app{display:flex;min-height:100vh}.side{width:230px;background:var(--panel);border-right:1px solid var(--line);position:fixed;inset:0 auto 0 0;padding:18px}.logo{font-size:24px;font-weight:800;color:var(--accent);margin-bottom:22px}.nav button{width:100%;border:0;background:transparent;color:var(--muted);text-align:left;padding:12px;border-radius:12px;margin:3px 0;cursor:pointer;font-weight:700}.nav button:hover,.nav button.active{background:var(--accent);color:#0b0f1a}.db{position:absolute;bottom:18px;left:18px;right:18px;color:var(--muted);font-size:12px}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#777;margin-right:6px}.main{margin-left:230px;flex:1}.top{height:66px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:2}h1{font-size:28px;margin:0}.content{padding:28px}.grid{display:grid;gap:16px}.stats{grid-template-columns:repeat(4,minmax(0,1fr))}.two{grid-template-columns:repeat(2,minmax(0,1fr))}.cards{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}.metric{font-size:42px;font-weight:900;color:var(--accent)}.muted{color:var(--muted)}.btn{border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--text);border-radius:10px;padding:9px 14px;cursor:pointer;font-weight:700}.btn.primary{background:var(--accent);border-color:var(--accent);color:#0b0f1a}.btn.danger{background:rgba(255,112,112,.15);border-color:rgba(255,112,112,.35);color:var(--danger)}.btn.small{padding:6px 9px;font-size:12px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}.badge{display:inline-block;border-radius:999px;padding:3px 9px;font-size:12px;background:rgba(255,255,255,.08);color:var(--muted)}.ok{color:var(--ok)}.dangerText{color:var(--danger)}table{width:100%;border-collapse:collapse}th,td{text-align:left;border-bottom:1px solid rgba(255,255,255,.06);padding:10px}th{font-size:12px;text-transform:uppercase;color:var(--muted)}input,select,textarea{width:100%;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:10px;color:var(--text);padding:10px;font:inherit}select option{background:#182136}textarea{min-height:90px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{margin-bottom:14px}.field label{display:block;color:var(--muted);font-size:12px;text-transform:uppercase;font-weight:800;margin-bottom:6px}.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;padding:20px;z-index:5}.modal-bg.open{display:flex}.modal{width:min(850px,100%);max-height:90vh;overflow:auto;background:#131c2e;border:1px solid var(--line);border-radius:18px;padding:22px}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.modal-title{font-size:24px;font-weight:900}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.day{min-height:92px;border:1px solid var(--line);background:rgba(255,255,255,.035);border-radius:12px;padding:8px;cursor:pointer}.day.today{border-color:var(--accent)}.event{font-size:12px;margin-top:5px;padding:3px 5px;border-radius:6px;background:rgba(232,255,71,.16);color:var(--accent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.checkrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.05)}.toggle{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--text);cursor:pointer}.toggle.present{background:var(--ok);color:#0b0f1a}.toggle.absent{background:rgba(255,112,112,.16);color:var(--danger)}@media(max-width:850px){.side{position:static;width:auto}.main{margin-left:0}.stats,.two,.formgrid{grid-template-columns:1fr}#app{display:block}}
</style>
</head>
<body>
<div id="app">
  <aside class="side">
    <div class="logo">🤾 HB Trainer</div>
    <nav class="nav" id="nav">
      <button class="active" data-page="dashboard">⚡ Dashboard</button>
      <button data-page="calendar">📅 Kalender</button>
      <button data-page="players">👥 Spieler</button>
      <button data-page="exercises">🏋️ Übungen</button>
      <button data-page="stats">📊 Statistiken</button>
    </nav>
    <div class="db" id="dbst"><span class="dot" id="dot"></span>Verbinde...</div>
  </aside>
  <main class="main">
    <div class="top"><h1 id="title">Dashboard</h1><div id="actions"></div></div>
    <div class="content" id="content">Lade...</div>
  </main>
</div>
<div class="modal-bg" id="modal" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modal-head"><div class="modal-title" id="modalTitle"></div><button class="btn" onclick="closeModal()">✕</button></div><div id="modalBody"></div></div></div>
<script>
const $=id=>document.getElementById(id);
const state={page:'dashboard',players:[],exercises:[],sessions:[],stats:{},cal:new Date(),filter:'alle'};
const titles={dashboard:'Dashboard',calendar:'Kalender',players:'Spieler',exercises:'Übungsbibliothek',stats:'Statistiken'};
const today=()=>new Date().toISOString().slice(0,10);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const fmt=d=>d?new Date(d+'T00:00:00').toLocaleDateString('de-DE'):'—';
const pace=(km,min)=>km&&min?`${Math.floor(min/km)}:${Math.round(((min/km)%1)*60).toString().padStart(2,'0')}`:null;
async function api(method,path,data,form){const opt={method,headers:{}};if(data&&!form){opt.headers['Content-Type']='application/json';opt.body=JSON.stringify(data)}else if(data){opt.body=data}const r=await fetch('/api'+path,opt);if(!r.ok){const e=await r.json().catch(()=>({}));throw new Error(e.error||r.statusText)}return r.json()}
const GET=p=>api('GET',p),POST=(p,d,f)=>api('POST',p,d,f),PUT=(p,d,f)=>api('PUT',p,d,f),DEL=p=>api('DELETE',p);
function setDb(ok,msg){const dot=$('dot'),dbst=$('dbst');if(dot)dot.style.background=ok?'var(--ok)':'var(--danger)';if(dbst)dbst.innerHTML=`<span class="dot" style="background:${ok?'var(--ok)':'var(--danger)'}"></span>${msg}`}
async function load(){try{[state.players,state.exercises,state.sessions,state.stats]=await Promise.all([GET('/players'),GET('/exercises'),GET('/sessions'),GET('/stats')]);setDb(true,'DB verbunden')}catch(e){setDb(false,'Kein Server');throw e}}
async function nav(page){state.page=page;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));$('title').textContent=titles[page]||'Dashboard';await load().catch(()=>{});render()}
document.querySelectorAll('#nav button').forEach(b=>b.addEventListener('click',()=>nav(b.dataset.page)));
function render(){$('actions').innerHTML='';({dashboard:dash,calendar:calendar,players:players,exercises:exercises,stats:stats}[state.page]||dash)()}
function dash(){const st=state.stats,up=state.sessions.filter(s=>s.date>=today()).slice(0,5);$('content').innerHTML=`<div class="grid stats"><div class="card"><div class="metric">${st.totalPlayers||0}</div><div class="muted">Spieler</div></div><div class="card"><div class="metric">${st.totalSessions||0}</div><div class="muted">Trainings</div></div><div class="card"><div class="metric">${st.avgAttendance||0}%</div><div class="muted">Anwesenheit</div></div><div class="card"><div class="metric">${(st.injured||0)+(st.sick||0)}</div><div class="muted">Ausfälle</div></div></div><div class="grid two" style="margin-top:18px"><div class="card"><h3>Nächste Trainings</h3>${up.length?up.map(s=>`<p><button class="btn small" onclick="openSession('${s.id}')">Öffnen</button> <b>${esc(s.title||'Training')}</b> ${fmt(s.date)} ${esc(s.time||'')}</p>`).join(''):'<p class="muted">Keine geplanten Trainings.</p>'}</div><div class="card"><h3>Schnellstart</h3><button class="btn primary" onclick="openPlayer()">+ Spieler</button> <button class="btn primary" onclick="openExercise()">+ Übung</button> <button class="btn primary" onclick="openSession(null,today())">+ Training</button></div></div>`}
function playerPerfSummary(p){const perf=p.performance||[],runs=p.session_runs||[];const km=[...perf,...runs].reduce((sum,e)=>sum+(parseFloat(e.distance_km)||0),0),min=[...perf,...runs].reduce((sum,e)=>sum+(parseFloat(e.time_min)||0),0),goals=perf.reduce((sum,e)=>sum+(parseInt(e.goals,10)||0),0);return{km:Math.round(km*10)/10,pace:pace(km,min),goals,activities:perf.length+runs.length}}
function players(){$('actions').innerHTML='<button class="btn primary" onclick="openPlayer()">+ Spieler</button> <button class="btn" onclick="openImport(\'players\')">CSV Import</button>';const list=state.filter==='alle'?state.players:state.players.filter(p=>p.status===state.filter);$('content').innerHTML=`<div class="toolbar">${['alle','fit','verletzt','krank'].map(f=>`<button class="btn small ${state.filter===f?'primary':''}" onclick="state.filter='${f}';players()">${f}</button>`).join('')}</div><div class="grid cards">${list.map(p=>{const ps=playerPerfSummary(p);return`<div class="card"><h3>#${esc(p.number||'?')} ${esc(p.name)}</h3><p class="muted">${esc(p.position||'ohne Position')}</p><p><span class="badge">${esc(p.status||'fit')}</span> <span class="badge">${ps.km} km</span> <span class="badge">${ps.goals} Tore</span></p><p class="muted">Pace: ${ps.pace||'—'} · Aktivitäten: ${ps.activities}</p><button class="btn small" onclick="openPlayer('${p.id}')">Bearbeiten</button> <button class="btn small primary" onclick="openProfile('${p.id}')">Lauf/Tore</button> <button class="btn small" onclick="openProfile('${p.id}')">Profil</button></div>`}).join('')||'<p class="muted">Keine Spieler.</p>'}</div>`}
function openPlayer(id){const p=id?state.players.find(x=>x.id===id):{name:'',number:'',position:'Tor',birthdate:'',contact:'',status:'fit',notes:''};modal(id?'Spieler bearbeiten':'Spieler hinzufügen',`<div class="formgrid"><div class="field"><label>Name *</label><input id="pName" value="${esc(p.name)}"></div><div class="field"><label>Nummer</label><input id="pNumber" value="${esc(p.number)}"></div><div class="field"><label>Position</label><input id="pPos" value="${esc(p.position)}"></div><div class="field"><label>Status</label><select id="pStatus">${['fit','verletzt','krank'].map(s=>`<option ${p.status===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="field"><label>Geburtstag</label><input type="date" id="pBirth" value="${esc(p.birthdate)}"></div><div class="field"><label>Kontakt</label><input id="pContact" value="${esc(p.contact)}"></div></div><div class="field"><label>Notizen</label><textarea id="pNotes">${esc(p.notes)}</textarea></div><button class="btn primary" onclick="savePlayer('${id||''}')">Speichern</button> ${id?`<button class="btn danger" onclick="deletePlayer('${id}')">Löschen</button>`:''}`)}
async function savePlayer(id){const data={name:$('pName').value,number:$('pNumber').value,position:$('pPos').value,status:$('pStatus').value,birthdate:$('pBirth').value,contact:$('pContact').value,notes:$('pNotes').value};try{id?await PUT('/players/'+id,data):await POST('/players',data);closeModal();await load();render()}catch(e){alert(e.message)}}
async function deletePlayer(id){if(confirm('Spieler löschen?')){await DEL('/players/'+id);closeModal();await load();render()}}
function openProfile(id){const p=state.players.find(x=>x.id===id),perf=p.performance||[],sessionRuns=(p.session_runs||[]).map(r=>({...r,source:'Training',opponent:r.title,goals:null,manual:false})),manual=perf.map(e=>({...e,source:'Spielerprofil',manual:true})),all=[...manual,...sessionRuns].sort((a,b)=>(b.date||'').localeCompare(a.date||''));const totalKm=all.reduce((sum,e)=>sum+(parseFloat(e.distance_km)||0),0),totalMin=all.reduce((sum,e)=>sum+(parseFloat(e.time_min)||0),0),totalGoals=perf.reduce((sum,e)=>sum+(parseInt(e.goals,10)||0),0);modal('Profil: '+esc(p.name),`<p><b>Position:</b> ${esc(p.position||'—')}</p><p><b>Status:</b> ${esc(p.status||'fit')}</p><p><b>Kontakt:</b> ${esc(p.contact||'—')}</p><p><b>Notizen:</b><br>${esc(p.notes||'—')}</p><div class="grid stats" style="margin:12px 0"><div class="card"><div class="metric">${Math.round(totalKm*10)/10}</div><div class="muted">km gesamt</div></div><div class="card"><div class="metric">${pace(totalKm,totalMin)||'—'}</div><div class="muted">Ø Pace</div></div><div class="card"><div class="metric">${totalGoals}</div><div class="muted">Tore</div></div><div class="card"><div class="metric">${all.length}</div><div class="muted">Aktivitäten</div></div></div><h3>Lauf eintragen / Tore pro Spiel</h3><p class="muted">Hier trägst du direkt beim Spieler ein, wann er wie viel in welcher Zeit gelaufen ist und wie viele Tore er in einem Spiel geworfen hat.</p><div class="formgrid"><div class="field"><label>Datum</label><input id="perfDate" type="date" value="${today()}"></div><div class="field"><label>Spiel / Gegner</label><input id="perfOpponent" placeholder="z.B. vs. HSV"></div><div class="field"><label>Strecke (km)</label><input id="perfKm" type="number" step="0.01" placeholder="5.2"></div><div class="field"><label>Zeit (Minuten)</label><input id="perfMin" type="number" step="0.1" placeholder="28"></div><div class="field"><label>Tore</label><input id="perfGoals" type="number" min="0" placeholder="0"></div><div class="field"><label>Notiz</label><input id="perfNotes" placeholder="optional"></div></div><button class="btn primary" onclick="addPerformance('${id}')">Leistung eintragen</button><h3>Aktivitäten / Läufe / Tore</h3><table style="margin-top:12px"><thead><tr><th>Datum</th><th>Quelle</th><th>Spiel/Training</th><th>Strecke</th><th>Zeit</th><th>Pace</th><th>Tore</th><th></th></tr></thead><tbody>${all.map(e=>`<tr><td>${fmt(e.date)}</td><td>${esc(e.source)}</td><td>${esc(e.opponent||'—')}</td><td>${e.distance_km??'—'} km</td><td>${e.time_min??'—'} min</td><td>${pace(e.distance_km,e.time_min)||'—'}</td><td>${e.goals??'—'}</td><td>${e.manual?`<button class="btn small" onclick="delPerformance('${e.id}','${id}')">✕</button>`:'—'}</td></tr>`).join('')||'<tr><td colspan="8" class="muted">Noch keine Leistungsdaten.</td></tr>'}</tbody></table><h3>Verletzungshistorie</h3><div class="formgrid"><input id="injDate" type="date" value="${today()}"><input id="injNote" placeholder="Notiz / Verletzung"></div><button class="btn primary" onclick="addInjury('${id}')">Eintragen</button><hr>${(p.injuries||[]).map(i=>`<p>${fmt(i.date)}: ${esc(i.note)} <button class="btn small" onclick="delInjury('${i.id}','${id}')">✕</button></p>`).join('')||'<p class="muted">Keine Einträge.</p>'}`)}
async function addPerformance(id){const data={date:$('perfDate').value,opponent:$('perfOpponent').value,distance_km:$('perfKm').value,time_min:$('perfMin').value,goals:$('perfGoals').value,notes:$('perfNotes').value};try{await POST('/players/'+id+'/performance',data);await load();openProfile(id)}catch(e){alert(e.message)}}async function delPerformance(i,p){await DEL('/performance/'+i);await load();openProfile(p)}
async function addInjury(id){await POST('/players/'+id+'/injuries',{date:$('injDate').value,note:$('injNote').value});await load();openProfile(id)}async function delInjury(i,p){await DEL('/injuries/'+i);await load();openProfile(p)}
function exercises(){$('actions').innerHTML='<button class="btn primary" onclick="openExercise()">+ Übung</button> <button class="btn" onclick="openImport(\'exercises\')">CSV Import</button>';$('content').innerHTML=`<div class="grid cards">${state.exercises.map(e=>`<div class="card"><h3>${esc(e.name)}</h3><p><span class="badge">${esc(e.category||'')}</span> <span class="badge">${esc(e.duration||15)} Min</span></p><p class="muted">${esc(e.description||'')}</p>${e.file_path?`<p><a style="color:var(--accent)" href="${esc(e.file_path)}" target="_blank">Datei öffnen</a></p>`:''}<button class="btn small" onclick="openExercise('${e.id}')">Bearbeiten</button></div>`).join('')||'<p class="muted">Keine Übungen.</p>'}</div>`}
function openExercise(id){const e=id?state.exercises.find(x=>x.id===id):{name:'',category:'Technik',duration:15,players_count:'',description:'',material:[]};modal(id?'Übung bearbeiten':'Übung erstellen',`<div class="formgrid"><div class="field"><label>Name *</label><input id="eName" value="${esc(e.name)}"></div><div class="field"><label>Kategorie</label><input id="eCat" value="${esc(e.category)}"></div><div class="field"><label>Dauer</label><input type="number" id="eDur" value="${esc(e.duration)}"></div><div class="field"><label>Spieleranzahl</label><input id="ePlayers" value="${esc(e.players_count)}"></div></div><div class="field"><label>Beschreibung</label><textarea id="eDesc">${esc(e.description)}</textarea></div><div class="field"><label>Material (kommagetrennt)</label><input id="eMat" value="${esc((e.material||[]).join(', '))}"></div><div class="field"><label>Datei/Bild</label><input type="file" id="eFile"></div><button class="btn primary" onclick="saveExercise('${id||''}')">Speichern</button> ${id?`<button class="btn danger" onclick="deleteExercise('${id}')">Löschen</button>`:''}`)}
async function saveExercise(id){const fd=new FormData();fd.append('name',$('eName').value);fd.append('category',$('eCat').value);fd.append('duration',$('eDur').value);fd.append('players_count',$('ePlayers').value);fd.append('description',$('eDesc').value);fd.append('material',JSON.stringify($('eMat').value.split(',').map(x=>x.trim()).filter(Boolean)));if($('eFile').files[0])fd.append('file',$('eFile').files[0]);try{id?await PUT('/exercises/'+id,fd,true):await POST('/exercises',fd,true);closeModal();await load();render()}catch(e){alert(e.message)}}
async function deleteExercise(id){if(confirm('Übung löschen?')){await DEL('/exercises/'+id);closeModal();await load();render()}}
function calendar(){$('actions').innerHTML=`<button class="btn primary" onclick="openSession(null,'${today()}')">+ Training</button> <button class="btn" onclick="openImport('sessions')">CSV Import</button>`;const d=state.cal,y=d.getFullYear(),m=d.getMonth(),first=(new Date(y,m,1).getDay()+6)%7,days=new Date(y,m+1,0).getDate();const names=['Mo','Di','Mi','Do','Fr','Sa','So'];let cells=names.map(n=>`<b class="muted">${n}</b>`).join('')+Array(first).fill('<div></div>').join('');for(let i=1;i<=days;i++){const date=`${y}-${String(m+1).padStart(2,'0')}-${String(i).padStart(2,'0')}`,ss=state.sessions.filter(s=>s.date===date);cells+=`<div class="day ${date===today()?'today':''}" onclick="openSession(null,'${date}')"><b>${i}</b>${ss.map(s=>`<div class="event" onclick="event.stopPropagation();openSession('${s.id}')">${esc(s.time||'')} ${esc(s.title||'Training')}</div>`).join('')}</div>`}$('content').innerHTML=`<div class="toolbar"><button class="btn" onclick="state.cal.setMonth(state.cal.getMonth()-1);calendar()">←</button><h2>${d.toLocaleDateString('de-DE',{month:'long',year:'numeric'})}</h2><button class="btn" onclick="state.cal=new Date();calendar()">Heute</button><button class="btn" onclick="state.cal.setMonth(state.cal.getMonth()+1);calendar()">→</button></div><div class="calendar">${cells}</div>`}
let currentSession=null;
function openSession(id,date){currentSession=id?JSON.parse(JSON.stringify(state.sessions.find(s=>s.id===id))):{id:null,title:'',date:date||today(),time:'18:00',present:[],absent:[],exercises:[],runs:[],notes:''};renderSessionModal(id)}
function renderSessionModal(id){const s=currentSession;modal(id?'Training bearbeiten':'Training erstellen',`<div class="formgrid"><div class="field"><label>Titel</label><input id="sTitle" value="${esc(s.title)}"></div><div class="field"><label>Datum</label><input type="date" id="sDate" value="${esc(s.date)}"></div><div class="field"><label>Uhrzeit</label><input type="time" id="sTime" value="${esc(s.time)}"></div></div><h3>Anwesenheit</h3>${state.players.map(p=>attRow(p)).join('')||'<p class="muted">Erst Spieler anlegen.</p>'}<h3>Übungen</h3>${state.exercises.map(e=>`<label class="checkrow"><input type="checkbox" data-ex="${e.id}" ${s.exercises.includes(e.id)?'checked':''}>${esc(e.name)}</label>`).join('')||'<p class="muted">Keine Übungen.</p>'}<div class="field"><label>Notizen</label><textarea id="sNotes">${esc(s.notes)}</textarea></div><button class="btn primary" onclick="saveSession('${id||''}')">Training speichern</button> ${id?`<button class="btn danger" onclick="deleteSession('${id}')">Löschen</button>`:''}`)}
function attRow(p){const pr=currentSession.present.includes(p.id),ab=currentSession.absent.includes(p.id),r=(currentSession.runs||[]).find(x=>x.player_id===p.id);return `<div class="checkrow"><button class="toggle ${pr?'present':ab?'absent':''}" onclick="toggleAtt('${p.id}')">${pr?'✓':ab?'×':''}</button><span style="flex:1">#${esc(p.number||'?')} ${esc(p.name)}</span>${pr?`<button class="btn small" onclick="editRun('${p.id}')">${r?esc(r.distance_km)+' km':'Lauf +'}</button>`:''}</div>`}
function toggleAtt(pid){const p=currentSession.present,a=currentSession.absent;if(p.includes(pid)){currentSession.present=p.filter(x=>x!==pid);currentSession.absent=[...a,pid]}else if(a.includes(pid)){currentSession.absent=a.filter(x=>x!==pid)}else{currentSession.present=[...p,pid]}renderSessionModal(currentSession.id)}
function editRun(pid){const r=(currentSession.runs||[]).find(x=>x.player_id===pid)||{};const km=prompt('Strecke in km',r.distance_km||'');const min=prompt('Zeit in Minuten',r.time_min||'');currentSession.runs=(currentSession.runs||[]).filter(x=>x.player_id!==pid);if(km||min)currentSession.runs.push({player_id:pid,distance_km:km,time_min:min});renderSessionModal(currentSession.id)}
async function saveSession(id){const exercises=[...document.querySelectorAll('[data-ex]:checked')].map(i=>i.dataset.ex);const data={title:$('sTitle').value,date:$('sDate').value,time:$('sTime').value,notes:$('sNotes').value,present:currentSession.present,absent:currentSession.absent,exercises,runs:currentSession.runs||[]};try{id?await PUT('/sessions/'+id,data):await POST('/sessions',data);closeModal();await load();render()}catch(e){alert(e.message)}}
async function deleteSession(id){if(confirm('Training löschen?')){await DEL('/sessions/'+id);closeModal();await load();render()}}
function stats(){const att=state.stats.attendanceRanking||[],runs=state.stats.runRanking||[],goals=state.stats.goalRanking||[],details=state.stats.runDetails||[];$('content').innerHTML=`<div class="grid two"><div class="card"><h3>Top 3 Laufleistung</h3>${runs.slice(0,3).map((r,i)=>`<p><b>${i+1}. #${esc(r.number||'?')} ${esc(r.name)}</b> <span class="badge">${r.total_km} km</span> Ø Pace ${r.pace||'—'}</p>`).join('')||'<p class="muted">Keine Laufdaten.</p>'}</div><div class="card"><h3>Top 3 Tore</h3>${goals.slice(0,3).map((g,i)=>`<p><b>${i+1}. #${esc(g.number||'?')} ${esc(g.name)}</b> <span class="badge">${g.goals} Tore</span> ${g.games} Spiel(e)</p>`).join('')||'<p class="muted">Keine Tordaten.</p>'}</div></div><div class="grid two" style="margin-top:18px"><div class="card"><h3>Rangliste Läufe</h3><table><thead><tr><th>#</th><th>Spieler</th><th>km</th><th>Ø Pace</th><th>Läufe</th></tr></thead><tbody>${runs.map((r,i)=>`<tr><td>${i+1}</td><td><button class="btn small" onclick="openProfile('${r.id}')">#${esc(r.number||'?')} ${esc(r.name)}</button></td><td>${r.total_km}</td><td>${r.pace||'—'}</td><td>${r.run_count}</td></tr>`).join('')||'<tr><td colspan="5" class="muted">Keine Laufdaten.</td></tr>'}</tbody></table></div><div class="card"><h3>Rangliste Tore</h3><table><thead><tr><th>#</th><th>Spieler</th><th>Tore</th><th>Spiele</th></tr></thead><tbody>${goals.map((g,i)=>`<tr><td>${i+1}</td><td><button class="btn small" onclick="openProfile('${g.id}')">#${esc(g.number||'?')} ${esc(g.name)}</button></td><td>${g.goals}</td><td>${g.games}</td></tr>`).join('')||'<tr><td colspan="4" class="muted">Keine Tordaten.</td></tr>'}</tbody></table></div></div><div class="card" style="margin-top:18px"><h3>Alle Läufe / Aktivitäten</h3><table><thead><tr><th>Datum</th><th>Spieler</th><th>Quelle</th><th>Spiel/Training</th><th>km</th><th>Zeit</th><th>Pace</th><th>Tore</th></tr></thead><tbody>${details.map(d=>`<tr><td>${fmt(d.date)}</td><td><button class="btn small" onclick="openProfile('${d.player_id}')">#${esc(d.number||'?')} ${esc(d.name)}</button></td><td>${d.source==='training'?'Training':'Spielerprofil'}</td><td>${esc(d.title||'—')}</td><td>${d.distance_km??'—'}</td><td>${d.time_min??'—'}</td><td>${pace(d.distance_km,d.time_min)||'—'}</td><td>${d.goals??'—'}</td></tr>`).join('')||'<tr><td colspan="8" class="muted">Keine Aktivitäten.</td></tr>'}</tbody></table></div><div class="card" style="margin-top:18px"><h3>Anwesenheit</h3>${att.map(p=>`<p><b>${esc(p.name)}</b> <span class="badge">${p.rate}%</span> ${p.present_count}/${p.total_sessions}</p>`).join('')||'<p class="muted">Keine Daten.</p>'}</div>`}

const importHelp={
  players:'Spalten: name,number,position,birthdate,contact,status,notes',
  exercises:'Spalten: name,category,description,players_count,duration,material. Mehrere Materialien mit | trennen.',
  sessions:'Spalten: title,date,time,notes,present,absent,exercises. Spieler/Übungen mit Nummer, Name oder ID und | trennen.'
};
const importTitle={players:'Spieler importieren',exercises:'Übungen importieren',sessions:'Trainings importieren'};
const importTemplate={players:'/templates/spieler.csv',exercises:'/templates/uebungen.csv',sessions:'/templates/trainings.csv'};
function openImport(type){modal(importTitle[type]||'CSV Import',`<p class="muted">Bitte eine CSV-Datei hochladen. Excel-Dateien vorher in Excel/LibreOffice als CSV speichern.</p><p><b>${esc(importHelp[type]||'')}</b></p><p><a style="color:var(--accent)" href="${importTemplate[type]}" download>CSV-Vorlage herunterladen</a></p><div class="field"><label>CSV-Datei</label><input type="file" id="importFile" accept=".csv,text/csv"></div><button class="btn primary" onclick="uploadImport('${type}')">Import starten</button>`)}
async function uploadImport(type){const file=$('importFile').files[0];if(!file){alert('Bitte CSV-Datei auswählen');return}const fd=new FormData();fd.append('file',file);try{const r=await POST('/import/'+type,fd,true);alert(`Import fertig: ${r.created||0} neu, ${r.updated||0} aktualisiert, ${r.skipped||0} übersprungen`);closeModal();await load();render()}catch(e){alert(e.message)}}

function modal(title,body){$('modalTitle').innerHTML=title;$('modalBody').innerHTML=body;$('modal').classList.add('open')}function closeModal(){$('modal').classList.remove('open')}
load().catch(()=>{}).finally(render);
</script>
</body>
</html>
